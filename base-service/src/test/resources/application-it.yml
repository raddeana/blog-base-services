# Integration test profile: embedded H2 in MySQL compatibility mode.
# No external MySQL / Nacos required.
spring:
  # override the optional:nacos: import list from application.yml
  config:
    import: []
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:blog_base;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
  autoconfigure:
    exclude:
      # knife4j customizer requires servlet/web springdoc beans, absent under webEnvironment=NONE
      - com.github.xiaoymin.knife4j.spring.configuration.Knife4jAutoConfiguration
      - com.github.xiaoymin.knife4j.spring.configuration.insight.Knife4jInsightAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
