server:
  port: 8080

spring:
  application:
    name: blog-base-services
  profiles:
    # default to local (Nacos discovery off); set SPRING_PROFILES_ACTIVE=prod in deployment
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:blog-base-services.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/blog_base?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PWD:root}

spring.cloud:
  nacos:
    server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    config:
      group: DEFAULT_GROUP
      file-extension: yml

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  packages-to-scan: com.blog.base

knife4j:
  enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
